# Training Configuration for Speech/Talking Detection

# Model Architecture
model:
  input_size: 35          # Feature vector dimension (updated from 25 for speech detection)
  hidden_size: 12         # Hidden layer neurons
  output_size: 1          # Binary classification (1=talking, 0=not talking)
  dropout: 0.2            # Dropout probability

# Training Parameters
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  early_stopping_patience: 10
  weight_decay: 0.0001    # L2 regularization

# Data Split
data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  balance_classes: true   # Balance talking/not-talking samples

# Feature Extraction
features:
  use_mar: true           # Mouth Aspect Ratio
  use_distances: true     # Inter-landmark distances
  use_temporal: true      # Speech-specific temporal features
  use_intensity: true     # Pixel intensity stats
  use_edges: true         # Edge responses
  temporal_window: 15     # Frames for temporal features (increased from 3 to 15 for speech patterns, ~0.5s at 30fps)

# Facial Landmarks
landmarks:
  detector: "opencv"   # Using OpenCV Haar Cascades (Python 3.13 compatible)
  confidence_threshold: 0.5

# Paths
paths:
  data_dir: "data/raw"  # Directory containing session folders
  label_dir: "data/labels"
  checkpoint_dir: "models/checkpoints"
  log_dir: "logs"

# Logging
logging:
  use_tensorboard: true
  save_frequency: 5       # Save checkpoint every N epochs
  print_frequency: 10     # Print metrics every N batches
